# Blueprint do Render (https://render.com) para o deploy gratuito da API.
# O banco fica fora do Render: crie um PostgreSQL com PostGIS (ex.: Neon) e
# cole a URL de conexão em DATABASE_URL no painel.
# ATENÇÃO: este arquivo ainda não foi testado em um deploy real.
services:
  - type: web
    name: reciclabairro-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
